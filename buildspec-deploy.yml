version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - node --version
      - npm --version
      - yum install -y zip
    finally:
      - echo "Install phase completed"

  pre_build:
    commands:
      - echo "Starting CDK deployment process..."
      - echo "Branch - $BRANCH_NAME"
      - echo "Stack Name - $STACK_NAME"
      - |
        if [ -z "$BRANCH_NAME" ] || [ -z "$STACK_NAME" ]; then
          echo "Required environment variables not set"
          exit 1
        fi
      - |
        CDK_CONTEXT="-c branchName=$BRANCH_NAME"
        if [ -n "$GITHUB_TOKEN" ] && [ -n "$GITHUB_OWNER" ] && [ -n "$GITHUB_REPO" ]; then
          CDK_CONTEXT="$CDK_CONTEXT -c githubOwner=$GITHUB_OWNER -c githubRepo=$GITHUB_REPO -c githubToken=$GITHUB_TOKEN"
          echo "GitHub mode enabled for $GITHUB_OWNER/$GITHUB_REPO"
        else
          echo "Bare mode (no GitHub CI/CD) -- frontend will be built and deployed by this build"
        fi
        export CDK_CONTEXT
      - echo "Changing to backend directory..."
      - cd backend
      - echo "Installing npm dependencies..."
      - npm install
      - echo "Checking if CDK bootstrap is needed..."
      - npx cdk bootstrap $CDK_CONTEXT --require-approval never
    finally:
      - echo "Pre-build phase completed"

  build:
    on-failure: ABORT
    commands:
      - echo "Deploying CDK stack..."
      - echo "Listing available stacks..."
      - npx cdk list $CDK_CONTEXT
      - echo "Deploying all stacks..."
      - npx cdk deploy --all $CDK_CONTEXT --require-approval never --verbose
      - echo "CDK deployment complete."

      # ----------------------------------------------------------------
      # Bare-mode frontend build
      # When no GitHub token was provided, Amplify has no source
      # provider -- we build the Next.js frontend here and deploy the
      # static export to Amplify via the create-deployment API.
      # In GitHub mode this entire section is skipped.
      # ----------------------------------------------------------------
      - |
        if [ -z "$GITHUB_TOKEN" ]; then
          set -euo pipefail
          echo ""
          echo "=== BARE-MODE FRONTEND BUILD ==="
          echo ""
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          BACKEND_STACK="RealEstateProgramStack-${SANITIZED_BRANCH}"
          AGENTCORE_STACK="AgentCoreStack-${SANITIZED_BRANCH}"
          AMPLIFY_STACK="AmplifyHostingStack-${SANITIZED_BRANCH}"
          echo "Extracting stack outputs..."
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey==\`$2\`].OutputValue" \
              --output text
          }
          export BARE_REGION=$(get_output "$BACKEND_STACK" "Region")
          export BARE_USER_POOL_ID=$(get_output "$BACKEND_STACK" "UserPoolId")
          export BARE_USER_POOL_CLIENT_ID=$(get_output "$BACKEND_STACK" "UserPoolClientId")
          export BARE_IDENTITY_POOL_ID=$(get_output "$BACKEND_STACK" "IdentityPoolId")
          export BARE_API_URL=$(get_output "$BACKEND_STACK" "ApiUrl")
          export BARE_WEBSOCKET_URL=$(get_output "$AGENTCORE_STACK" "AgentCoreWebSocketUrl")
          export BARE_AMPLIFY_APP_ID=$(get_output "$AMPLIFY_STACK" "AmplifyAppId")
          echo "  Region            = $BARE_REGION"
          echo "  UserPoolId        = $BARE_USER_POOL_ID"
          echo "  UserPoolClientId  = $BARE_USER_POOL_CLIENT_ID"
          echo "  IdentityPoolId    = $BARE_IDENTITY_POOL_ID"
          echo "  ApiUrl            = $BARE_API_URL"
          echo "  WebSocketUrl      = $BARE_WEBSOCKET_URL"
          echo "  AmplifyAppId      = $BARE_AMPLIFY_APP_ID"
          if [ -z "$BARE_AMPLIFY_APP_ID" ] || [ -z "$BARE_API_URL" ] || [ -z "$BARE_USER_POOL_ID" ]; then
            echo "Failed to retrieve required stack outputs."
            echo "The backend is deployed -- you can build and deploy the frontend manually."
            exit 0
          fi
          echo "Changing to frontend directory..."
          cd $CODEBUILD_SRC_DIR/frontend
          echo "Creating .env.local with stack outputs..."
          echo "NEXT_PUBLIC_COGNITO_REGION=$BARE_REGION" | tee .env.local
          echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$BARE_USER_POOL_ID" >> .env.local
          echo "NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=$BARE_USER_POOL_CLIENT_ID" >> .env.local
          echo "NEXT_PUBLIC_COGNITO_IDENTITY_POOL_ID=$BARE_IDENTITY_POOL_ID" >> .env.local
          echo "NEXT_PUBLIC_API_BASE_URL=$BARE_API_URL" >> .env.local
          echo "NEXT_PUBLIC_WEBSOCKET_API_URL=$BARE_WEBSOCKET_URL" >> .env.local
          echo "Installing frontend dependencies..."
          npm install
          echo "Building Next.js static export..."
          npm run build
          if [ ! -d out ]; then
            echo "ERROR: 'out' directory not produced by 'npm run build'."
            echo "Listing frontend contents for debugging:"
            ls -la
            exit 1
          fi
          echo "Creating deployment package..."
          ( cd out && zip -r build.zip . )
          if [ ! -f out/build.zip ]; then
            echo "ERROR: out/build.zip was not created."
            exit 1
          fi
          echo "Build artifact ready: $(du -h out/build.zip | cut -f1) at $CODEBUILD_SRC_DIR/frontend/out/build.zip"
          echo "Persisting Amplify metadata for post_build..."
          echo "$BARE_AMPLIFY_APP_ID" > $CODEBUILD_SRC_DIR/.bare_amplify_app_id
        else
          echo "GitHub mode -- Amplify builds the frontend from source automatically."
        fi
    finally:
      - echo "Build phase completed"

  post_build:
    commands:
      - echo "Deployment completed successfully!"
      - echo "Stack Name - $STACK_NAME"
      - echo "Retrieving stack outputs..."
      - aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs' --output table || echo "Could not retrieve outputs"

      # Update the Anam session token Lambda with the ANAM_API_KEY env var
      - |
        echo "Updating AnamSessionToken Lambda environment variables..."
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
        ANAM_LAMBDA=$(aws lambda list-functions \
          --query "Functions[?contains(FunctionName, 'AnamSessionToken')].FunctionName" \
          --output text 2>/dev/null | head -1)
        if [ -n "$ANAM_LAMBDA" ] && [ "$ANAM_LAMBDA" != "None" ]; then
          echo "Found Lambda: $ANAM_LAMBDA"
          # Fetch current env vars so we preserve existing keys (e.g. ALLOWED_ORIGINS)
          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "$ANAM_LAMBDA" \
            --query 'Environment.Variables' \
            --output json 2>/dev/null || echo '{}')
          # Build updated variables: merge ANAM_API_KEY into existing vars using Node
          UPDATED_VARS=$(node -e "
            const current = JSON.parse(process.env.CURRENT_ENV || '{}');
            current['ANAM_API_KEY'] = process.env.ANAM_API_KEY;
            console.log(JSON.stringify(current));
          " CURRENT_ENV="$CURRENT_ENV")
          aws lambda update-function-configuration \
            --function-name "$ANAM_LAMBDA" \
            --environment "Variables=$UPDATED_VARS" \
            --no-cli-pager > /dev/null
          echo "✓ Lambda $ANAM_LAMBDA updated with ANAM_API_KEY."
        else
          echo "WARNING: No Lambda containing 'AnamSessionToken' found -- skipping ANAM_API_KEY injection."
        fi

      # Seed the four personas into DynamoDB
      - |
        echo "Seeding personas into DynamoDB..."
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
        BACKEND_STACK="RealEstateProgramStack-${SANITIZED_BRANCH}"
        PERSONAS_TABLE=$(aws cloudformation describe-stacks \
          --stack-name "$BACKEND_STACK" \
          --query "Stacks[0].Outputs[?OutputKey=='PersonasTableName'].OutputValue" \
          --output text 2>/dev/null || echo "")
        if [ -z "$PERSONAS_TABLE" ] || [ "$PERSONAS_TABLE" = "None" ]; then
          echo "WARNING: Could not find PersonasTableName in stack outputs — skipping persona seeding."
        else
          echo "Seeding into table: $PERSONAS_TABLE"
          node -e "
            const { DynamoDBClient, PutItemCommand } = require('@aws-sdk/client-dynamodb');
            const client = new DynamoDBClient({ region: process.env.AWS_DEFAULT_REGION });
            const table = process.env.PERSONAS_TABLE;

            const personas = [
              {
                personaID: process.env.ANAM_LENDER_ID,
                name: 'Commercial Lender',
                description: 'A commercial lender evaluating the financial viability and risk profile of your real estate development proposal.',
                personaPrompt: 'You are a senior commercial lender at a major bank evaluating a real estate development loan application. Your primary concerns are debt service coverage ratio, loan-to-value ratio, project feasibility, borrower experience, and market conditions. Ask probing questions about financial projections, risk mitigation, and exit strategy. Be analytical and skeptical but professional.',
                expertise: 'expert',
                communicationStyle: 'analytical',
                keyPriorities: ['Debt service coverage ratio', 'Loan-to-value ratio', 'Project feasibility', 'Borrower track record', 'Market conditions'],
                presentationTime: '15 minutes',
                timeLimitSec: 900,
                qaTimeLimitSec: 300,
                voiceId: 'matthew',
                anamPersonaId: process.env.ANAM_LENDER_ID,
                icon: 'briefcase',
                bestPractices: { wpm: { min: 130, max: 160 }, eyeContact: { min: 65 }, fillerWords: { max: 3 }, pauses: { min: 4 } },
                scoringWeights: { pace: 0.25, eyeContact: 0.30, fillerWords: 0.20, pauses: 0.25 }
              },
              {
                personaID: process.env.ANAM_OFFICIAL_ID,
                name: 'Public Official',
                description: 'A city planning or zoning official reviewing your development for community impact, regulatory compliance, and public benefit.',
                personaPrompt: 'You are a city planning commissioner reviewing a real estate development proposal. Your concerns include zoning compliance, community impact, environmental considerations, traffic, affordable housing requirements, and public benefit. Ask about how the project benefits the community, addresses regulatory requirements, and mitigates negative impacts. Be thorough and community-focused.',
                expertise: 'intermediate',
                communicationStyle: 'formal',
                keyPriorities: ['Zoning compliance', 'Community impact', 'Environmental considerations', 'Traffic and infrastructure', 'Affordable housing'],
                presentationTime: '15 minutes',
                timeLimitSec: 900,
                qaTimeLimitSec: 300,
                voiceId: 'tiffany',
                anamPersonaId: process.env.ANAM_OFFICIAL_ID,
                icon: 'people',
                bestPractices: { wpm: { min: 130, max: 160 }, eyeContact: { min: 65 }, fillerWords: { max: 3 }, pauses: { min: 4 } },
                scoringWeights: { pace: 0.25, eyeContact: 0.30, fillerWords: 0.20, pauses: 0.25 }
              },
              {
                personaID: process.env.ANAM_AGENT_ID,
                name: 'Real Estate Agent',
                description: 'An experienced real estate agent assessing your property from a market perspective — comparable sales, buyer appeal, and listing strategy.',
                personaPrompt: 'You are an experienced real estate agent with deep knowledge of local market conditions. You are evaluating a real estate development or investment from a market perspective. Focus on comparable sales, market timing, buyer/tenant demand, pricing strategy, and competitive positioning. Be practical, market-driven, and direct.',
                expertise: 'intermediate',
                communicationStyle: 'conversational',
                keyPriorities: ['Market comparables', 'Pricing strategy', 'Buyer/tenant demand', 'Market timing', 'Competitive positioning'],
                presentationTime: '15 minutes',
                timeLimitSec: 900,
                qaTimeLimitSec: 300,
                voiceId: 'amy',
                anamPersonaId: process.env.ANAM_AGENT_ID,
                icon: 'school',
                bestPractices: { wpm: { min: 130, max: 160 }, eyeContact: { min: 65 }, fillerWords: { max: 3 }, pauses: { min: 4 } },
                scoringWeights: { pace: 0.25, eyeContact: 0.30, fillerWords: 0.20, pauses: 0.25 }
              },
              {
                personaID: process.env.ANAM_NEGOTIATOR_ID,
                name: 'Negotiation Counterparty',
                description: 'A tough negotiator on the other side of a real estate transaction — testing your deal terms, leverage, and negotiation strategy.',
                personaPrompt: 'You are a sophisticated negotiator representing the other party in a real estate transaction. Your goal is to test the presenter's negotiation strategy, identify weaknesses in their position, and push for better terms. Ask challenging questions about pricing justification, contingencies, timeline, and deal structure. Be assertive, strategic, and look for leverage points.',
                expertise: 'expert',
                communicationStyle: 'competitive',
                keyPriorities: ['Deal terms', 'Pricing justification', 'Contingencies', 'Timeline', 'Leverage and concessions'],
                presentationTime: '15 minutes',
                timeLimitSec: 900,
                qaTimeLimitSec: 300,
                voiceId: 'matthew',
                anamPersonaId: process.env.ANAM_NEGOTIATOR_ID,
                icon: 'mic',
                bestPractices: { wpm: { min: 130, max: 160 }, eyeContact: { min: 65 }, fillerWords: { max: 3 }, pauses: { min: 4 } },
                scoringWeights: { pace: 0.25, eyeContact: 0.30, fillerWords: 0.20, pauses: 0.25 }
              }
            ];

            function toItem(obj) {
              const item = {};
              for (const [k, v] of Object.entries(obj)) {
                if (v === null || v === undefined) item[k] = { NULL: true };
                else if (typeof v === 'string') item[k] = { S: v };
                else if (typeof v === 'number') item[k] = { N: String(v) };
                else if (typeof v === 'boolean') item[k] = { BOOL: v };
                else if (Array.isArray(v)) item[k] = { L: v.map(i => typeof i === 'string' ? { S: i } : { N: String(i) }) };
                else if (typeof v === 'object') {
                  const m = {};
                  for (const [mk, mv] of Object.entries(v)) {
                    if (typeof mv === 'object' && !Array.isArray(mv)) {
                      const nested = {};
                      for (const [nk, nv] of Object.entries(mv)) {
                        nested[nk] = typeof nv === 'number' ? { N: String(nv) } : { S: String(nv) };
                      }
                      m[mk] = { M: nested };
                    } else {
                      m[mk] = typeof mv === 'number' ? { N: String(mv) } : { S: String(mv) };
                    }
                  }
                  item[k] = { M: m };
                }
              }
              return item;
            }

            (async () => {
              for (const p of personas) {
                await client.send(new PutItemCommand({ TableName: table, Item: toItem(p) }));
                console.log('Seeded:', p.name);
              }
              console.log('All personas seeded successfully.');
            })().catch(e => { console.error('Seeding failed:', e); process.exit(1); });
          "
        fi

      # Bare-mode: deploy frontend to Amplify
      - |
        if [ -z "$GITHUB_TOKEN" ] && [ -f "$CODEBUILD_SRC_DIR/.bare_amplify_app_id" ]; then
          set -eo pipefail
          export BARE_AMPLIFY_APP_ID=$(cat $CODEBUILD_SRC_DIR/.bare_amplify_app_id)
          BUILD_ZIP="$CODEBUILD_SRC_DIR/frontend/out/build.zip"
          if [ ! -f "$BUILD_ZIP" ]; then
            echo "ERROR: Expected build artifact not found at $BUILD_ZIP."
            echo "The build phase did not produce the static export. Aborting."
            exit 1
          fi
          echo "Deploying frontend to Amplify (artifact: $BUILD_ZIP)..."
          cd $CODEBUILD_SRC_DIR/frontend

          echo "Cancelling any in-progress Amplify jobs..."
          ACTIVE_JOBS=$(aws amplify list-jobs \
            --app-id "$BARE_AMPLIFY_APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --region "$AWS_DEFAULT_REGION" \
            --query "jobSummaries[?status=='PENDING' || status=='RUNNING'].jobId" \
            --output text 2>/dev/null || true)
          if [ -n "$ACTIVE_JOBS" ] && [ "$ACTIVE_JOBS" != "None" ]; then
            for JID in $ACTIVE_JOBS; do
              echo "  Stopping job $JID..."
              aws amplify stop-job \
                --app-id "$BARE_AMPLIFY_APP_ID" \
                --branch-name "$BRANCH_NAME" \
                --job-id "$JID" \
                --region "$AWS_DEFAULT_REGION" 2>/dev/null || true
            done
            echo "  Waiting for jobs to stop..."
            sleep 5
          fi

          echo "Creating Amplify deployment..."
          if ! aws amplify create-deployment \
            --app-id "$BARE_AMPLIFY_APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --region "$AWS_DEFAULT_REGION" \
            --output json > deployment_response.json; then
            echo "ERROR: Failed to create Amplify deployment."
            cat deployment_response.json 2>/dev/null || true
            echo "Backend is deployed but frontend deployment failed."
            exit 1
          fi

          echo "Extracting upload URL and job ID..."
          export UPLOAD_URL=$(node -e "const data=require('./deployment_response.json'); console.log(data.zipUploadUrl)")
          export JOB_ID=$(node -e "const data=require('./deployment_response.json'); console.log(data.jobId)")
          if [ -z "$UPLOAD_URL" ] || [ -z "$JOB_ID" ]; then
            echo "ERROR: Could not extract upload URL or job ID from deployment response."
            cat deployment_response.json
            exit 1
          fi

          echo "Uploading build.zip to Amplify..."
          if ! curl --fail -s -X PUT -T "$BUILD_ZIP" "$UPLOAD_URL"; then
            echo "ERROR: Failed to upload build.zip to Amplify."
            exit 1
          fi

          echo "Starting deployment..."
          aws amplify start-deployment \
            --app-id "$BARE_AMPLIFY_APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --job-id "$JOB_ID" \
            --region "$AWS_DEFAULT_REGION"
          echo "Deployment finished successfully!"
        fi
    finally:
      - echo "Post-build phase completed"
